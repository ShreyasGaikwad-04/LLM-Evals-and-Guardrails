[project]
name = "llm-evaluation-guardrails-platform"
version = "0.1.0"
description = "A practical platform for LLM evaluation, guardrails, and regression testing"
readme = "README.md"
authors = [
    { name = "ShreyasGaikwad-04", email = "shreyasgaikwad004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.50,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
llm-evaluation-guardrails-platform = "llm_evaluation_guardrails_platform:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
